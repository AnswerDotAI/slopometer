name: Deploy to GitHub Pages

permissions:
  contents: write
  pages: write

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v6
        with:
          path: ~/.cache/slopometer
          key: en_core_web_md-3.8.0
      - uses: answerdotai/workflows/quarto-ghp3@master
